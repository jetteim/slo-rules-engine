---
groups:
- name: sloth-slo-sli-recordings-checkout-api-http-requests-public-api-successful-requests
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: |
      sum(rate(http_server_request_duration_seconds_count{service="checkout-api",route="/checkout",status!="success"}[5m]))
      /
      sum(rate(http_server_request_duration_seconds_count{service="checkout-api",route="/checkout"}[5m]))
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
      sloth_window: 5m
  - record: slo:sli_error:ratio_rate30d
    expr: |
      sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}[30d])
      / ignoring (sloth_window)
      count_over_time(slo:sli_error:ratio_rate5m{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}[30d])
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
      sloth_window: 30d
- name: sloth-slo-meta-recordings-checkout-api-http-requests-public-api-successful-requests
  rules:
  - record: slo:objective:ratio
    expr: vector(0.999)
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: slo:error_budget:ratio
    expr: vector(1-0.999)
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: slo:time_period:days
    expr: vector(30)
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: slo:current_burn_rate:ratio
    expr: |
      slo:sli_error:ratio_rate5m{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}
      / on(sloth_id, sloth_slo, sloth_service) group_left
      slo:error_budget:ratio{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: slo:period_burn_rate:ratio
    expr: |
      slo:sli_error:ratio_rate30d{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}
      / on(sloth_id, sloth_slo, sloth_service) group_left
      slo:error_budget:ratio{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: slo:period_error_budget_remaining:ratio
    expr: |
      1 - slo:period_burn_rate:ratio{sloth_id="checkout-api-http-requests-public-api-successful-requests",sloth_service="checkout-api",sloth_slo="http-requests-public-api-successful-requests"}
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
  - record: sloth_slo_info
    expr: vector(1)
    labels:
      owner: payments-platform
      sloth_id: checkout-api-http-requests-public-api-successful-requests
      sloth_service: checkout-api
      sloth_slo: http-requests-public-api-successful-requests
      sloth_mode: cli-gen-prom
      sloth_objective: "99.9"
      sloth_spec: prometheus/v1
      sloth_version: v0.11.0
- name: sloth-slo-alerts-checkout-api-http-requests-public-api-successful-requests
  rules:
  - alert: CheckoutApiHttpRequestsPublicApiSuccessfulRequestsBurn
    expr: |
      slo:current_burn_rate:ratio{sloth_id="checkout-api-http-requests-public-api-successful-requests"} > 14.4
    labels:
      severity: page
      sloth_severity: page
